  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getAllSpots() {
    return BASE_SPOTS.concat(customSpots);
  }

  function findSpotById(id) {
    var all = getAllSpots();
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === id) return all[i];
    }
    return null;
  }

  function getNavUrl(spot) {
    var lng = (typeof spot.lng === 'number') ? spot.lng : DEFAULT_LNG;
    var lat = (typeof spot.lat === 'number') ? spot.lat : DEFAULT_LAT;
    var name = encodeURIComponent(spot.name || '目的地');
    return 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + name + '&mode=car&callnative=1';
  }

  function loadFeedbackSent() {
    try {
      var raw = localStorage.getItem(KEY_FEEDBACK);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveFeedbackSent(obj) {
    try {
      localStorage.setItem(KEY_FEEDBACK, JSON.stringify(obj));
    } catch (e) {
      console.warn('保存反馈记录失败：', e);
    }
  }

  function submitFeedback(spot, type) {
    var payload = {
      access_key: WEB3FORMS_KEY,
      subject: '昆明打卡点反馈：' + spot.name + ' - ' + type,
      from_name: '昆明网红打卡地图',
      spot_name: spot.name,
      spot_id: spot.id,
      spot_type: spot.type,
      spot_source: spot.source || '',
      feedback: type,
      time: new Date().toLocaleString('zh-CN'),
      page_url: location.href
    };
    return fetch(WEB3FORMS_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(payload)
    }).then(function (res) { return res.json(); });
  }

  function handleFeedback(id, type, btn) {
    var spot = findSpotById(id);
    if (!spot) return;

    var sent = loadFeedbackSent();
    if (sent[id]) {
      alert('你已经反馈过这个地点了，感谢！');
      return;
    }

    var row = btn.closest('.feedback-row');
    if (!row) return;
    var btns = row.querySelectorAll('.fb-btn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

    submitFeedback(spot, type).then(function (res) {
      if (res && res.success) {
        sent[id] = type;
        saveFeedbackSent(sent);
        row.innerHTML = '<span class="fb-thanks">🙏 感谢反馈（已标记为：' + escapeHtml(type) + '）</span>';
      } else {
        for (var j = 0; j < btns.length; j++) btns[j].disabled = false;
        alert('提交失败，请稍后再试');
      }
    }).catch(function (e) {
      console.error('反馈提交失败：', e);
      for (var k = 0; k < btns.length; k++) btns[k].disabled = false;
      alert('网络错误，请稍后再试');
    });
  }

  function loadFromStorage() {

          customSpots = arr.filter(function (s) {
            return s && typeof s === 'object' && s.id && s.name && s.type;
          });
          customSpots.forEach(function (s) {
            if (typeof s.lng !== 'number') s.lng = DEFAULT_LNG;
            if (typeof s.lat !== 'number') s.lat = DEFAULT_LAT;
            if (typeof s.img !== 'string') s.img = '';
          });
        }
      }
    } catch (e) {
      console.warn('读取自定义打卡点失败：', e);
      customSpots = [];
    }

    try {
      var rawVisited = localStorage.getItem(KEY_VISITED);
      if (rawVisited) {
        var vArr = JSON.parse(rawVisited);
        if (Array.isArray(vArr)) {
          visitedIds = new Set(vArr.filter(function (id) {
            return typeof id === 'string';
          }));
        }
      }
    } catch (e) {
      console.warn('读取去过记录失败：', e);
      visitedIds = new Set();
    }
  }

  function saveCustomSpots() {
    try {
      localStorage.setItem(KEY_CUSTOM, JSON.stringify(customSpots));
      return true;
    } catch (e) {
      console.warn('保存自定义打卡点失败：', e);
      alert('保存失败：浏览器本地存储空间不足。\n\n建议：\n1. 删除一些带大图片的自定义打卡点\n2. 改用"粘贴图片网址"而不是上传本地图片\n3. 换一个体积更小的图片');
      return false;
    }
  }

  function saveVisitedIds() {

      localStorage.setItem(KEY_VISITED, JSON.stringify(Array.from(visitedIds)));

      console.warn('保存去过记录失败：', e);

  function updateStats() {
    var all = getAllSpots();
    var total = all.length;
    var done = 0;
    for (var i = 0; i < all.length; i++) {
      if (visitedIds.has(all[i].id)) done++;
    }

      statsText.textContent = '已打卡 ' + done + ' / ' + total;

  function buildEmptyHtml() {
    var hasFilter = (currentFilter !== 'all')
      || (currentSource !== 'all')
      || (currentSearch.trim() !== '');

    var title = hasFilter ? '没有找到匹配的打卡点' : '这里还没有打卡点';
    var desc = hasFilter
      ? '试试换个关键词，或者放宽一点筛选条件'
      : '点下面的「添加打卡点」，把你私藏的地方加进来';

    var html = '';
    html += '<div class="empty">';
    html += '  <div class="empty-illus">';
    html += '    <div class="empty-circle"></div>';
    html += '    <span class="empty-emoji">' + (hasFilter ? '🔍' : '🗺️') + '</span>';
    html += '    <span class="empty-dot d1"></span>';
    html += '    <span class="empty-dot d2"></span>';
    html += '    <span class="empty-dot d3"></span>';
    html += '  </div>';
    html += '  <div class="empty-title">' + title + '</div>';
    html += '  <div class="empty-desc">' + desc + '</div>';

    }

  function render() {
    var all = getAllSpots();
    var keyword = currentSearch.trim().toLowerCase();
    var feedbackSent = loadFeedbackSent();

    var filtered = all.filter(function (spot) {
      if (currentFilter !== 'all' && spot.type !== currentFilter) return false;
      if (currentSource !== 'all' && (spot.source || '其他') !== currentSource) return false;
      if (keyword) {
        var nameHit = String(spot.name).toLowerCase().indexOf(keyword) !== -1;
        var descHit = String(spot.desc || '').toLowerCase().indexOf(keyword) !== -1;
        if (!nameHit && !descHit) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      cardList.innerHTML = buildEmptyHtml();
      updateStats();
      return;
    }

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      var spot = filtered[i];
      var visited = visitedIds.has(spot.id);
      var isCustom = spot.id.indexOf('custom-') === 0;
      var emoji = TYPE_EMOJI[spot.type] || '📍';
      var sentType = feedbackSent[spot.id];

      html += '<div class="card" data-spot-id="' + escapeHtml(spot.id) + '">';

      if (spot.img) {
        html += '<img class="card-thumb" src="' + escapeHtml(spot.img) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;card-thumb placeholder&quot;>' + emoji + '</div>\'">';
      } else {
        html += '<div class="card-thumb placeholder">' + emoji + '</div>';
      }

      html += '  <div class="card-main">';
      html += '    <div class="card-title">';
      html += '      <span class="name">' + escapeHtml(spot.name) + '</span>';
      html += '      <span class="badge type">' + escapeHtml(spot.type) + '</span>';
      html += '      <span class="badge source">' + escapeHtml(spot.source || '其他') + '</span>';
      html += '    </div>';
      html += '    <div class="card-desc">' + escapeHtml(spot.desc || '') + '</div>';
      html += '    <div class="card-actions">';
      html += '      <button type="button" class="visit-btn' + (visited ? ' visited' : '') + '" data-action="visit" data-id="' + escapeHtml(spot.id) + '">' + (visited ? '✓ 已去过' : '我去过') + '</button>';
      html += '      <a class="nav-btn" href="' + getNavUrl(spot) + '" target="_blank" rel="noopener">🧭 导航</a>';
      if (isCustom) {
        html += '      <button type="button" class="edit-btn" data-action="edit" data-id="' + escapeHtml(spot.id) + '">编辑</button>';
        html += '      <button type="button" class="del-btn" data-action="delete" data-id="' + escapeHtml(spot.id) + '">删除</button>';
      }
      html += '    </div>';
      html += '  </div>';

      if (sentType) {
        html += '<div class="feedback-row done">';
        html += '  <span class="fb-thanks">🙏 感谢反馈（已标记为：' + escapeHtml(sentType) + '）</span>';
        html += '</div>';
      } else {
        html += '<div class="feedback-row">';
        html += '  <span class="fb-label">这家店还在吗？</span>';
        html += '  <button type="button" class="fb-btn fb-ok" data-action="fb-ok" data-id="' + escapeHtml(spot.id) + '">✅ 还在</button>';
        html += '  <button type="button" class="fb-btn fb-gone" data-action="fb-gone" data-id="' + escapeHtml(spot.id) + '">❌ 不在了</button>';
        html += '</div>';
      }

    }

  function initMap() {
    if (!mapContainer) {
      console.error('地图容器 #mapContainer 不存在');
      return;
    }
    if (typeof AMapLoader === 'undefined') {
      mapContainer.innerHTML = '<div class="map-error">地图加载失败<br>AMapLoader 未定义<br>请检查网络或 loader.js 是否被拦截</div>';
      return;
    }
    console.log('当前使用的 Key：', isLocalHost ? '本地 Key' : '线上 Key');
    AMapLoader.load({
      key: AMAP_KEY,
      version: '2.0',
      plugins: ['AMap.InfoWindow', 'AMap.Marker', 'AMap.Geolocation']
    }).then(function (AMap) {
      AMapRef = AMap;
      map = new AMap.Map('mapContainer', {
        center: [DEFAULT_LNG, DEFAULT_LAT],
        zoom: 11
      });
      infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -30) });

      if (AMap.Geolocation) {
        geolocation = new AMap.Geolocation({
          enableHighAccuracy: true,
          timeout: 10000
        });
      }

      map.on('click', function (e) {
        if (!pickMode) return;
        var lng = e.lnglat.getLng();
        var lat = e.lnglat.getLat();

        if (tempMarker) {
          map.remove(tempMarker);
        }
        tempMarker = new AMapRef.Marker({
          position: [lng, lat],
          title: '新位置',
          animation: 'AMAP_ANIMATION_DROP'
        });
        map.add(tempMarker);

        if (pickFor === 'suggest') {
          sugLocRow.classList.add('picked');
          sugLocText.textContent = lng.toFixed(5) + ', ' + lat.toFixed(5);
          sugCopyBtn.style.display = 'inline-block';
          sugCopyBtn.setAttribute('data-coord', lng.toFixed(6) + ', ' + lat.toFixed(6));
          sugCopyBtn.textContent = '复制坐标';
          sugCopyBtn.classList.remove('copied');
        } else {
          pickedLng = lng;
          pickedLat = lat;
          locRow.classList.add('picked');
          locText.textContent = '已选位置：' + lng.toFixed(5) + ', ' + lat.toFixed(5);
        }

        exitPickMode();
      });

      renderMarkers();
      console.log('地图加载成功');
    }).catch(function (e) {
      console.error('地图加载失败：', e);
      var msg = '地图加载失败';
      if (e && e.message) msg += '<br>' + e.message;
      msg += '<br>常见原因：<br>1. 本地 Key 的白名单没留空<br>2. Key 配置错误<br>3. 网络问题';
      mapContainer.innerHTML = '<div class="map-error">' + msg + '</div>';
    });
  }

  function renderMarkers() {
    if (!map || !AMapRef) return;
    if (markers.length > 0) {
      map.remove(markers);
      markers = [];
    }
    var all = getAllSpots();
    all.forEach(function (spot) {
      var lng = (typeof spot.lng === 'number') ? spot.lng : DEFAULT_LNG;
      var lat = (typeof spot.lat === 'number') ? spot.lat : DEFAULT_LAT;
      var marker = new AMapRef.Marker({
        position: [lng, lat],
        title: spot.name
      });
      marker.on('click', function () {
        if (pickMode) return;
        infoWindow.setContent(buildInfoHtml(spot));
        infoWindow.open(map, marker.getPosition());
      });
      map.add(marker);
      markers.push(marker);
    });
  }

  function flyToSpot(spot) {
    if (!map || !AMapRef || !spot) return;
    var lng = (typeof spot.lng === 'number') ? spot.lng : DEFAULT_LNG;
    var lat = (typeof spot.lat === 'number') ? spot.lat : DEFAULT_LAT;

    if (typeof map.setZoomAndCenter === 'function') {
      map.setZoomAndCenter(15, [lng, lat], false, 400);
    } else {
      map.setZoom(15);
      map.setCenter([lng, lat]);
    }

    setTimeout(function () {
      infoWindow.setContent(buildInfoHtml(spot));
      infoWindow.open(map, new AMapRef.LngLat(lng, lat));
    }, 420);

    mapContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

    pickMode = true;

    pickFor = null;

    locText.textContent = '未选择位置（默认放在市中心）';
    sugLocRow.classList.remove('picked');
    sugLocText.textContent = '未选择位置';
    sugCopyBtn.style.display = 'none';
    sugCopyBtn.textContent = '复制坐标';
    sugCopyBtn.classList.remove('copied');
    sugCopyBtn.removeAttribute('data-coord');
    mapHint.className = '';

  function showMyLocation() {
    if (!geolocation || !map) {
      alert('定位服务还没准备好，请稍等地图加载完成再试');
      return;
    }
    if (myLocBtn.classList.contains('loading')) return;

    myLocBtn.classList.add('loading');
    myLocBtn.textContent = '⏳';

    geolocation.getCurrentPosition(function (status, result) {
      myLocBtn.classList.remove('loading');
      myLocBtn.textContent = '📍';

      if (status === 'complete') {
        var lng = result.position.lng;
        var lat = result.position.lat;

        if (myLocationMarker) {
          map.remove(myLocationMarker);
          myLocationMarker = null;
        }

        myLocationMarker = new AMapRef.Marker({
          position: [lng, lat],
          content: '<div class="my-loc-dot">' +
                     '<div class="my-loc-pulse"></div>' +
                     '<div class="my-loc-core"></div>' +
                   '</div>',
          offset: new AMapRef.Pixel(-12, -12),
          title: '我的位置',

        });
        map.add(myLocationMarker);

        if (typeof map.setZoomAndCenter === 'function') {
          map.setZoomAndCenter(15, [lng, lat], false, 400);
        } else {
          map.setZoom(15);

      } else {

        alert(msg);

    }, {

  function compressImage(file, cb) {
    var MAX = 900;
    var QUALITY = 0.72;
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.width;
        var h = img.height;
        if (w > MAX || h > MAX) {
          var ratio = Math.min(MAX / w, MAX / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try {
          cb(canvas.toDataURL('image/jpeg', QUALITY));
        } catch (err) {
          cb(e.target.result);
        }
      };
      img.onerror = function () {
        alert('这张图片无法读取，换一张试试');
      };
      img.src = e.target.result;
    };
    reader.onerror = function () {
      alert('读取图片失败，换一张试试');
    };
    reader.readAsDataURL(file);
  }

    var s = btn.dataset.source;
    if (!s) return;
    currentSource = s;
    syncSourceButtons();

  cardList.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');

    if (btn) {
      var action = btn.dataset.action;

      if (action === 'reset-filters') {
        currentSearch = '';
        currentFilter = 'all';
        currentSource = 'all';
        searchInput.value = '';
        syncFilterButtons();
        syncSourceButtons();
        render();
        return;
      }

      var id = btn.dataset.id;
      if (!id) return;

      if (action === 'fb-ok' || action === 'fb-gone') {
        handleFeedback(id, action === 'fb-ok' ? '还在' : '不在了', btn);
        return;
      }

      if (action === 'visit') {
        if (visitedIds.has(id)) {
          visitedIds.delete(id);
        } else {
          visitedIds.add(id);
        }
        saveVisitedIds();

        if (typeof gtag === 'function') {
          var vSpot = findSpotById(id);
          gtag('event', 'click_visit', {
            spot_name: vSpot ? vSpot.name : '',
            spot_id: id
          });
        }

        render();
        return;
      }

      if (action === 'edit') {
        var spotToEdit = findSpotById(id);
        if (!spotToEdit) return;
        enterEditMode(spotToEdit);
        return;
      }

      if (action === 'delete') {
        var target = findSpotById(id);
        if (!target) return;
        if (!confirm('确定删除「' + target.name + '」吗？')) return;

        if (editingId === id) {
          exitEditMode();
          addForm.classList.remove('open');
        }

        customSpots = customSpots.filter(function (s) { return s.id !== id; });
        visitedIds.delete(id);
        saveCustomSpots();
        saveVisitedIds();
        render();
        renderMarkers();
        return;
      }
      return;
    }

    if (e.target.closest('.nav-btn')) return;

    var card = e.target.closest('.card');
    if (!card) return;
    var spotId = card.dataset.spotId;
    if (!spotId) return;
    var spot = findSpotById(spotId);
    if (!spot) return;
    flyToSpot(spot);

  locLocateBtn.addEventListener('click', function () {

      return;
    }
    if (pickMode) exitPickMode();

    locLocateBtn.textContent = '定位中...';
    locLocateBtn.disabled = true;

    geolocation.getCurrentPosition(function (status, result) {
      locLocateBtn.textContent = '📍 定位';
      locLocateBtn.disabled = false;

      if (status === 'complete') {
        var lng = result.position.lng;
        var lat = result.position.lat;

        pickedLng = lng;
        pickedLat = lat;

        locRow.classList.add('picked');
        locText.textContent = '当前位置：' + lng.toFixed(5) + ', ' + lat.toFixed(5);

        if (tempMarker) { map.remove(tempMarker); }
        tempMarker = new AMapRef.Marker({
          position: [lng, lat],
          title: '我的位置',
          animation: 'AMAP_ANIMATION_DROP'
        });
        map.add(tempMarker);
        map.setZoomAndCenter(15, [lng, lat], false, 400);
      } else {
        var msg = '定位失败';
        if (result && result.info) msg += '：' + result.info;
        msg += '\n\n常见原因：\n1. 浏览器地址栏左边点开，把"位置"权限改成"允许"\n2. Windows 设置 → 隐私 → 位置，打开"位置服务"并允许浏览器\n3. 这台电脑没有可用的定位源（没有 WiFi 定位模块）\n4. 手机通过局域网 IP 访问时不支持定位，需部署到 HTTPS';
        alert(msg);
      }
    }, {
      enableHighAccuracy: true,
      timeout: 10000,
      showButton: false,
      showMarker: false,
      showCircle: false,
      panToLocation: false,
      zoomToAccuracy: false
    });
  });

  myLocBtn.addEventListener('click', showMyLocation);

  addSubmitBtn.addEventListener('click', function () {
    var name = newNameInput.value.trim();
    if (!name) {
      alert('请填写打卡点名称');
      newNameInput.focus();
      return;
    }

    if (editingId) {
      var target = null;
      for (var i = 0; i < customSpots.length; i++) {
        if (customSpots[i].id === editingId) { target = customSpots[i]; break; }
      }
      if (!target) {
        exitEditMode();
        return;
      }

      var backup = {
        name: target.name,
        type: target.type,
        source: target.source,
        desc: target.desc,
        lng: target.lng,
        lat: target.lat,
        img: target.img
      };

      target.name = name;
      target.type = newTypeSelect.value;
      target.source = newSourceSelect.value;
      target.desc = newDescInput.value.trim();
      target.lng = (typeof pickedLng === 'number') ? pickedLng : DEFAULT_LNG;
      target.lat = (typeof pickedLat === 'number') ? pickedLat : DEFAULT_LAT;
      target.img = formImg;

      if (!saveCustomSpots()) {
        target.name = backup.name;
        target.type = backup.type;
        target.source = backup.source;
        target.desc = backup.desc;
        target.lng = backup.lng;
        target.lat = backup.lat;
        target.img = backup.img;
        return;
      }

      exitEditMode();
      addForm.classList.remove('open');

      render();
      renderMarkers();
      return;
    }

    var newSpot = {
      id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      name: name,
      type: newTypeSelect.value,
      source: newSourceSelect.value,
      desc: newDescInput.value.trim(),
      lng: (typeof pickedLng === 'number') ? pickedLng : DEFAULT_LNG,
      lat: (typeof pickedLat === 'number') ? pickedLat : DEFAULT_LAT,
      img: formImg
    };

    customSpots.push(newSpot);
    if (!saveCustomSpots()) {
      customSpots.pop();
      return;
    }

    resetAddForm();
    addForm.classList.remove('open');
    resetPickState();

    currentFilter = 'all';
    currentSource = 'all';
    currentSearch = '';
    searchInput.value = '';
    syncFilterButtons();
    syncSourceButtons();
    render();
    renderMarkers();

    cardList.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  newNameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addSubmitBtn.click();
    }
  });

  suggestToggleBtn.addEventListener('click', function () {
    suggestWrapper.classList.toggle('open');
    if (suggestWrapper.classList.contains('open')) {
      suggestToggleBtn.classList.add('open');
      suggestToggleBtn.textContent = '✕ 收起推荐表单';
      setTimeout(function () {
        suggestWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    } else {
      suggestToggleBtn.classList.remove('open');
      suggestToggleBtn.textContent = '📮 推荐新地点';
      resetPickState();
    }
  });

  sugPickBtn.addEventListener('click', function () {
    if (pickMode) return;
    enterPickMode('suggest');
  });

  sugCopyBtn.addEventListener('click', function () {
    var coord = sugCopyBtn.getAttribute('data-coord');
    if (!coord) return;

    function onCopied() {
      sugCopyBtn.textContent = '✅ 已复制';
      sugCopyBtn.classList.add('copied');
      setTimeout(function () {
        sugCopyBtn.textContent = '复制坐标';
        sugCopyBtn.classList.remove('copied');
      }, 2200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(coord).then(onCopied).catch(function () {
        fallbackCopy(coord, onCopied);
      });
    } else {
      fallbackCopy(coord, onCopied);
    }
  });

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      if (cb) cb();
    } catch (e) {
      alert('复制失败，请手动长按选中复制：' + text);
    }
    document.body.removeChild(ta);
  }

  exportBtn.addEventListener('click', function () {
    if (customSpots.length === 0 && visitedIds.size === 0) {
      alert('你现在还没有添加过打卡点，也没有打卡记录，没什么可导出的。');
      return;
    }
    var data = {
      version: 1,
      app: 'kunming-map',
      exportedAt: new Date().toISOString(),
      customSpots: customSpots,
      visitedIds: Array.from(visitedIds)
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var now = new Date();
    var stamp = now.getFullYear()
      + String(now.getMonth() + 1).padStart(2, '0')
      + String(now.getDate()).padStart(2, '0')
      + '-' + String(now.getHours()).padStart(2, '0')
      + String(now.getMinutes()).padStart(2, '0');

    var a = document.createElement('a');
    a.href = url;
    a.download = 'kunming-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importFile.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!confirm('导入会把你备份文件里的打卡点和打卡记录合并到当前数据中。\n同 id 的打卡点会跳过，不会覆盖现有数据。\n\n继续吗？')) {
      importFile.value = '';
      return;
    }

    var reader = new FileReader();
    reader.onload = function (ev) {
      var data;
      try {
        data = JSON.parse(ev.target.result);
      } catch (err) {
        alert('文件格式不对，不是有效的 JSON 备份文件。');
        importFile.value = '';
        return;
      }
      if (!data || typeof data !== 'object') {
        alert('文件内容不是有效的备份数据。');
        importFile.value = '';
        return;
      }

      var importedSpots = Array.isArray(data.customSpots) ? data.customSpots : [];
      var importedVisited = Array.isArray(data.visitedIds) ? data.visitedIds : [];

      var existingIds = {};
      for (var i = 0; i < customSpots.length; i++) {
        existingIds[customSpots[i].id] = true;
      }

      var addedSpots = 0;
      for (var j = 0; j < importedSpots.length; j++) {
        var s = importedSpots[j];
        if (!s || typeof s !== 'object' || !s.id || !s.name || !s.type) continue;
        if (existingIds[s.id]) continue;
        if (typeof s.lng !== 'number') s.lng = DEFAULT_LNG;
        if (typeof s.lat !== 'number') s.lat = DEFAULT_LAT;
        if (typeof s.img !== 'string') s.img = '';
        if (typeof s.source !== 'string') s.source = '其他';
        if (typeof s.desc !== 'string') s.desc = '';
        customSpots.push(s);
        existingIds[s.id] = true;
        addedSpots++;
      }

      var addedVisited = 0;
      for (var k = 0; k < importedVisited.length; k++) {
        var vid = importedVisited[k];
        if (typeof vid === 'string' && !visitedIds.has(vid)) {
          visitedIds.add(vid);
          addedVisited++;
        }
      }

      if (addedSpots > 0) saveCustomSpots();
      if (addedVisited > 0) saveVisitedIds();

      render();
      renderMarkers();

      alert('导入完成：\n新增 ' + addedSpots + ' 个打卡点\n新增 ' + addedVisited + ' 条打卡记录\n\n现有数据已合并保留。');
      importFile.value = '';
    };
    reader.onerror = function () {
      alert('读取文件失败，请重试。');
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  loadFromStorage();
  syncFilterButtons();
  syncSourceButtons();
  render();
  updateImgPreview();
  initMap();

  console.log('昆明网红打卡地图已就绪');
});
</script>
